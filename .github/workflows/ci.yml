name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the tested packaged component
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs: { sha256: "${{ steps.package.outputs.sha256 }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tests/host/go.mod
          cache-dependency-path: tests/host/go.sum
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Check release version
        if: github.ref_type == 'tag'
        env: { RELEASE_TAG: "${{ github.ref_name }}" }
        run: python3 -B scripts/release.py check-tag
      - name: Release automation tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Unit tests
        run: cargo test --locked --all-features
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -Dwarnings;
          cargo fmt --check
      - name: Build the component
        run: cargo build --locked --release --lib --target wasm32-wasip2
      - name: Package the component and static metadata
        run: cargo run --locked --features package --bin package --
          target/wasm32-wasip2/release/actionlint_plugin_shellcheck.wasm artifacts
      - name: Host integration
        run: go -C tests/host test -mod=readonly ./...
      - name: Build the installer host
        shell: bash
        run: go -C tests/host build -mod=readonly
          -o "${RUNNER_TEMP}/actionlint" actionlint.kjanat.dev/v2/cmd/actionlint
      - name: Install the published plugin and verify offline execution
        shell: bash
        run: python3 -B scripts/verify_installation.py
          --actionlint "${RUNNER_TEMP}/actionlint"
          --version v0.1.1 --sha256 c33638bb1fac6167e4dcd3a5fb7f59fcaa639c93d2287c4dda07f2beea3522b4
          | tee installation.json | jq .
      - name: Preserve installation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-verification
          path: installation.json
          if-no-files-found: error
      - name: Record tested package digest
        id: package
        run: python3 -B scripts/release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actionlint-plugin-shellcheck
          path: artifacts/
          if-no-files-found: error
