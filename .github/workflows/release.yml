name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    uses: $/.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actionlint-plugin-shellcheck
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-verification
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-actionlint
          path: ${{ runner.temp }}
      - name: Make the tested host executable
        shell: bash
        run: chmod +x "${RUNNER_TEMP}/actionlint"
      - name: Publish the tested candidate and verify delivery
        id: publish
        uses: kjanat/actionlint-registry/publish@255b6695bf1d6b79d30b227a40f656d9a351b1d2
        with:
          sha256: ${{ needs.build.outputs.sha256 }}
          candidate-receipt: candidate.json
          actionlint: ${{ runner.temp }}/actionlint
          fixture: tests/installation.ts
      - name: Preserve publication receipt
        if: always() && steps.publish.outputs.submission-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-publication-receipt
          path: |
            publication.json
            installation.json
          if-no-files-found: error
