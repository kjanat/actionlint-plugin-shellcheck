#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

[tools]
"github:kjanat/kprint"    = "latest"
"github:kjanat/runner"    = "0.28.0"
"github:rvben/rumdl"      = "0.3.2"
"github:tombi-toml/tombi" = "1.11.2"
deno                      = "2.9.8"
go                        = "1.27.4"
golangci-lint             = "2.15.0"

[tools."github:WebAssembly/binaryen"]
version        = "133"
version_prefix = "version_"
filter_bins    = ["wasm-opt"]

[deps.deno]
auto    = true
sources = ["deno.lock", "scripts/**/*.ts", "tests/*.ts"]
run     = "deno install"

[settings]
experimental        = true
minimum_release_age = "0s"

[env]
RUSTUP_AUTO_INSTALL = 1
