[package]
name         = "actionlint-plugin-shellcheck"
version      = "0.2.1"
edition      = "2024"
rust-version = "1.99"
description  = "ShellCheck for actionlint run steps as a WebAssembly component, built on shellcheck-rs"
repository   = "https://github.com/kjanat/actionlint-plugin-shellcheck"
license      = "GPL-3.0-or-later"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name              = "package"
path              = "src/bin/package.rs"
required-features = ["package"]

[dependencies]
actionlint-extension-api = { path = "vendor/actionlint-extension-api", features = ["tool-integration"] }
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
shellcheck-rs            = { git = "https://github.com/kjanat/shellcheck-rs", rev = "3baffe9875c27668b8978c2a6a26b245f8a9c801" }

[features]
package = ["actionlint-extension-api/package"]

[profile.release]
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
