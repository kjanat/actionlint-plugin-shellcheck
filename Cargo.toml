[package]
name         = "actionlint-plugin-shellcheck"
version      = "0.1.1"
edition      = "2024"
rust-version = "1.99"
description  = "ShellCheck for actionlint run steps as a WebAssembly component, built on shellcheck-rs"
repository   = "https://github.com/kjanat/actionlint-plugin-shellcheck"
license      = "GPL-3.0-or-later"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package"
path = "src/bin/package.rs"
required-features = ["package"]

[features]
package = ["dep:sha2", "dep:wasm-encoder", "dep:wasmparser"]

[dependencies]
regex         = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
shellcheck-rs = { git = "https://github.com/kjanat/shellcheck-rs", rev = "add3a224247289eef411a68bfd2d7b6d34d9284c" }
wit-bindgen   = "0.63"
sha2          = { version = "0.10", optional = true }
wasm-encoder  = { version = "0.262", optional = true }
wasmparser    = { version = "0.262", optional = true }

[profile.release]
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
